name: ekkademy_gazedetection
description: >
  On-device, camera-based attentiveness / gaze detection for Flutter.
  Detects distraction (looking away), closed eyes, missing face, and
  multiple persons in frame using ML Kit face detection. Not tied to any
  particular screen — use it from a video player, live class, audio
  player, or quiz.
version: 0.1.0
homepage: https://github.com/Shikkha-Sheba/app_ekkademy_gazedetection
publish_to: 'none' # remove this line if/when you actually publish to pub.dev


environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_face_detection: ^0.14.0
  permission_handler: ^13.0.0
  just_audio: ^0.10.6
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

